spring:
  application:
    name: mynotion-backend

  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  security:
    jwt:
      expiration: 86400000

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.mynotionai: DEBUG

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
